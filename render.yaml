# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard > New > Blueprint > pick this repo. Render asks for the two values marked sync: false.
services:
  - type: web
    name: cms-process-guide
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # always on (the free plan sleeps after 15 minutes idle)
    healthCheckPath: /api/health
    autoDeploy: true
    # Uploaded images and videos live here and survive deploys and restarts.
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: SEED_ADMIN_PASSWORD
        sync: false # password for the first admin (admin@example.com)
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "true" # seeds only when the database has no users
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      # To move media to S3 later, add AWS_S3_BUCKET, AWS_REGION, AWS_ACCESS_KEY_ID and
      # AWS_SECRET_ACCESS_KEY (and optionally CLOUDFRONT_URL) under Environment in the dashboard.
