# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard > New > Blueprint > pick this repo. Render asks for the two values marked sync: false.
services:
  - type: web
    name: cms-process-guide
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free plan: sleeps after 15 minutes without visitors, so keep it awake with an uptime
    # monitor pinging /api/health every 5 minutes. Switch to "starter" for always-on plus a disk.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    # The free plan has no persistent disk: uploads are wiped on each deploy or restart.
    # On "starter", add a disk (name: uploads, mountPath: /app/uploads) or configure S3.
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: SEED_ADMIN_PASSWORD
        sync: false # password for the first admin (admin@example.com)
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "true" # seeds only when the database has no users
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      # To move media to S3 later, add AWS_S3_BUCKET, AWS_REGION, AWS_ACCESS_KEY_ID and
      # AWS_SECRET_ACCESS_KEY (and optionally CLOUDFRONT_URL) under Environment in the dashboard.
