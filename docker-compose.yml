services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/cms-guide
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
      # Plain HTTP on localhost; set to true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  mongo-data:
  uploads:
